<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>Chess Game</h1>
      <section class="game-layout" aria-label="Chess game">
        <div class="play-area">
          <div class="toolbar">
            <button id="new-game" type="button">New Game</button>
            <p id="status" aria-live="polite">White to move</p>
          </div>
          <div class="settings" aria-label="Game settings">
            <label class="sound-setting"><input id="sound-enabled" type="checkbox" checked /> Sound</label>
          </div>
          <p class="instructions">Two players share this board. White and Black take turns; the board stays in the same orientation.</p>
          <div id="board" class="board" role="grid" aria-label="Chess board"></div>
        </div>
        <aside class="history-panel" aria-labelledby="history-title">
          <h2 id="history-title">Moves</h2>
          <ol id="move-history" class="move-history" aria-live="polite"></ol>
          <button id="download-pgn" class="secondary-button" type="button">Download PGN</button>
        </aside>
      </section>
    </main>

    <dialog id="promotion-dialog" aria-labelledby="promotion-title">
      <form method="dialog" class="promotion-content">
        <h2 id="promotion-title">Promote your pawn</h2>
        <p>Choose a piece:</p>
        <div id="promotion-choices" class="promotion-choices"></div>
      </form>
    </dialog>

    <script src="script.js"></script>
    <script src="extras.js"></script>
  </body>
</html>
